<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Axes -->
  <g stroke="#94a3b8" stroke-width="2" opacity="0.5">
    <line x1="90" y1="380" x2="530" y2="380" />
    <line x1="90" y1="380" x2="90" y2="70" />
  </g>

  <!-- Earlier gradient descent iterations -->
  <g stroke="#6366f1" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <line x1="100" y1="300" x2="520" y2="290" opacity="0.2" />
    <line x1="100" y1="330" x2="520" y2="200" opacity="0.3" />
    <line x1="100" y1="350" x2="520" y2="140" opacity="0.45" />
  </g>

  <!-- Data points -->
  <g fill="#38bdf8">
    <circle cx="120" cy="340" r="7" />
    <circle cx="150" cy="365" r="7" />
    <circle cx="180" cy="320" r="7" />
    <circle cx="210" cy="335" r="7" />
    <circle cx="240" cy="290" r="7" />
    <circle cx="270" cy="305" r="7" />
    <circle cx="300" cy="255" r="7" />
    <circle cx="330" cy="270" r="7" />
    <circle cx="360" cy="220" r="7" />
    <circle cx="390" cy="235" r="7" />
    <circle cx="420" cy="180" r="7" />
    <circle cx="450" cy="195" r="7" />
    <circle cx="480" cy="140" r="7" />
    <circle cx="505" cy="125" r="7" />
  </g>

  <!-- Fitted regression line -->
  <line x1="100" y1="365" x2="520" y2="110" stroke="url(#lineGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

  <!-- Cost curve (MSE) panel -->
  <rect x="580" y="90" width="170" height="150" rx="16" fill="#ffffff" opacity="0.05" />
  <path d="M 600 110 Q 620 210 660 215 T 735 222" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round" />
  <circle cx="735" cy="222" r="6" fill="#ec4899" />
  <text x="600" y="265" font-family="monospace" font-size="18" fill="#94a3b8">MSE ↓</text>

  <!-- Equation -->
  <text x="580" y="340" font-family="monospace" font-size="30" font-weight="bold" fill="#e2e8f0">ŷ = mx + b</text>
</svg>

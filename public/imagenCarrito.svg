<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Decorative Abstract Circles -->
  <circle cx="700" cy="100" r="150" fill="#34d399" opacity="0.03" />
  <circle cx="100" cy="350" r="100" fill="#fbbf24" opacity="0.02" />

  <!-- Logo Icon Container -->
  <g transform="translate(400, 200)">
    <!-- Glow effect behind -->
    <circle cx="0" cy="-20" r="75" fill="#10b981" opacity="0.15" filter="url(#glow)" />
    
    <!-- Organic Leaf -->
    <path d="M-40 -60 C-40 -60 -10 -90 20 -60 C50 -30 20 20 20 20 C20 20 -20 20 -40 -10 C-60 -40 -40 -60 -40 -60 Z" fill="url(#leafGrad)" />
    <path d="M-40 -60 C-10 -40 20 20 20 20" stroke="#064e3b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.4" />
    
    <!-- Minimalist Shopping Cart Overlay -->
    <path d="M-60 10 L-45 10 L-25 50 L25 50 L45 15 L-35 15" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
    <circle cx="-15" cy="65" r="8" fill="url(#goldGrad)" />
    <circle cx="15" cy="65" r="8" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="4" text-anchor="middle">
    VERDEMENTE
  </text>
  <text x="400" y="375" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#34d399" letter-spacing="6" text-anchor="middle" opacity="0.8">
    BOUTIQUE E-COMMERCE
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="acceptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Grid lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Background Graph Accents (Subtle) -->
  <path d="M 100 150 L 250 80 L 350 220" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.05" />
  <circle cx="100" cy="150" r="10" fill="#3b82f6" opacity="0.05" />
  <circle cx="250" cy="80" r="8" fill="#3b82f6" opacity="0.05" />
  <circle cx="350" cy="220" r="12" fill="#3b82f6" opacity="0.05" />

  <!-- State Transition Diagram Container -->
  <g transform="translate(180, 45)">
    <!-- Start State Arrow -->
    <path d="M 0 135 L 70 135" stroke="#3b82f6" stroke-width="4" marker-end="url(#arrow)" fill="none" stroke-linecap="round" />
    <polygon points="70,135 60,128 60,142" fill="#3b82f6" />

    <!-- State q0 -->
    <g transform="translate(110, 135)">
      <circle cx="0" cy="0" r="40" fill="url(#bgGrad)" stroke="url(#nodeGrad)" stroke-width="4" filter="url(#glow)" />
      <text x="0" y="8" font-family="monospace" font-size="20" font-weight="bold" fill="#3b82f6" text-anchor="middle">q0</text>
    </g>

    <!-- Transition Arc q0 -> q1 (top) -->
    <path d="M 148 115 Q 220 70 292 115" stroke="#a855f7" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Transition Arrowhead -->
    <polygon points="292,115 280,108 285,122" fill="#a855f7" />
    <text x="220" y="75" font-family="monospace" font-size="18" fill="#a855f7" text-anchor="middle" font-weight="bold">1</text>

    <!-- Transition Arc q1 -> q0 (bottom) -->
    <path d="M 292 155 Q 220 200 148 155" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Transition Arrowhead -->
    <polygon points="148,155 160,162 155,148" fill="#3b82f6" />
    <text x="220" y="210" font-family="monospace" font-size="18" fill="#3b82f6" text-anchor="middle" font-weight="bold">0</text>

    <!-- Self loop on q0 -->
    <path d="M 90 102 C 70 60 150 60 130 102" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round" />
    <polygon points="130,102 135,90 123,94" fill="#3b82f6" />
    <text x="110" y="45" font-family="monospace" font-size="18" fill="#3b82f6" text-anchor="middle" font-weight="bold">0</text>

    <!-- State q1 (Accepting State) -->
    <g transform="translate(330, 135)">
      <!-- Outer Ring (Accept state has double ring) -->
      <circle cx="0" cy="0" r="40" fill="url(#bgGrad)" stroke="url(#acceptGrad)" stroke-width="4" filter="url(#glow)" />
      <!-- Inner Ring -->
      <circle cx="0" cy="0" r="32" fill="none" stroke="url(#acceptGrad)" stroke-width="2" />
      <text x="0" y="8" font-family="monospace" font-size="20" font-weight="bold" fill="#ec4899" text-anchor="middle">q1</text>
    </g>

    <!-- Self loop on q1 -->
    <path d="M 310 102 C 290 60 370 60 350 102" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round" />
    <polygon points="350,102 355,90 343,94" fill="#ec4899" />
    <text x="330" y="45" font-family="monospace" font-size="18" fill="#ec4899" text-anchor="middle" font-weight="bold">1</text>
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="4" text-anchor="middle">
    DFA SIMULATOR
  </text>
  <text x="400" y="375" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a855f7" letter-spacing="6" text-anchor="middle" opacity="0.8">
    TEORÍA DE COMPUTACIÓN & GRAFOS
  </text>
</svg>
